version: 2
updates:
  # Keep GitHub Actions on supported majors (e.g. ahead of runtime deprecations).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # Python dependencies: one grouped PR a month, so CI (tests, pip-audit) vets each bump.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
